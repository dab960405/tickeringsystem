name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and verify coverage
        run: ./mvnw -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  frontend:
    name: Angular client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Angular tests
        working-directory: frontend
        run: npm test
      - name: Build Angular production bundle
        working-directory: frontend
        run: npm run build
      - name: Verify deep links and reload with real Chrome
        working-directory: frontend
        run: python3 browser_smoke.py
      - name: Check Angular formatting
        id: format
        working-directory: frontend
        run: npm run format:check
      - name: Print exact Prettier diff on formatting failure
        if: failure() && steps.format.outcome == 'failure'
        working-directory: frontend
        run: |
          npm exec prettier -- --write "src/**/*.{ts,html,css}" *.json
          git diff -- src/

  python:
    name: Python local tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test local frontend gateway
        run: python3 -m unittest discover -s frontend -p 'test_*.py' -v
      - name: Test local automation scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
